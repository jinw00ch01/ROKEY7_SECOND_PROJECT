/**:
  ros__parameters:
    # Order source
    order_source: "mock"        # mock | db | file | firestore | supabase
    mock_order_almond: 2
    mock_order_cashew: 2
    mock_order_pistachio: 2
    mock_order_walnut: 2
    db_service_name: "/db/get_nut_order"
    # FileOrderProvider reads cobot_voice's latest_order.json. Empty path
    # forces caller to provide one explicitly via launch arg or override.
    file_order_path: ""
    file_order_require_success: true
    # FirestoreOrderProvider reads robot_session/current — the same doc
    # web_stt_firebase_v2 publishes on a successful browser voice order.
    # Dedupe key is `request_id`; service account path falls back to
    # GOOGLE_APPLICATION_CREDENTIALS / FIREBASE_SERVICE_ACCOUNT envs when blank.
    firestore_collection: "robot_session"
    firestore_document: "current"
    firestore_service_account_path: ""
    firestore_require_success: true
    # SupabaseOrderProvider — robot_session.current 단일 행을 읽는다.
    # web_stt_supabase_v2가 publishRecommendationResult로 채운 그 행과 동일.
    # request_id로 dedup, success=false면 거부.
    supabase_require_success: true

    # cobot_db (Supabase) — exception_logs / inventory persistence.
    # cobot_db 패키지가 설치돼 있어야 하고 .env(SUPABASE_URL, SUPABASE_KEY)가
    # 필요하다. 모든 DB 호출은 swallow되므로 false여도 픽 사이클은 동일하게
    # 동작한다. db_env_path 빈 문자열이면 노드 실행 디렉터리의 .env 사용.
    db_logging_enabled: true
    db_env_path: ""

    # Selection priority within the order book
    class_priority: ["almond", "cashew", "pistachio", "walnut"]

    # Target selector
    conf_gate: 0.40
    min_depth_mm: 2.0
    workspace_xmin_mm: 200.0
    workspace_xmax_mm: 700.0
    workspace_ymin_mm: -300.0
    workspace_ymax_mm: 300.0
    # Tightened to nut height range (observed 61-66mm). Outliers from
    # depth-dropout pixels (e.g., z=85+) get rejected so target_selector
    # falls back to a sibling candidate of the same class.
    workspace_zmin_mm: 40.0
    workspace_zmax_mm: 80.0

    # Return pose: release happens at this z; the action's
    # approach_offset_z_mm (default 80mm) is applied above for transit.
    # z=90 matches scripts/pick_all.py DEFAULT_RETURN_XYZ — keep in sync.
    return_xyz_mm: [367.0, -150.0, 90.0]
    return_zyz_deg: [168.0, 179.0, 168.0]

    # Pre-grasp gripper width = short_axis_mm + margin, clamped to [min, max].
    # Set margin < 0 to disable pre-positioning.
    pre_grasp_margin_mm: 8.0
    pre_grasp_min_mm: 15.0
    pre_grasp_max_mm: 80.0

    # Per-class fine-tune offsets are loaded from
    # cobot_config/config/pick_offsets.yaml (shared source of truth).
    # Set this path to override; empty string falls back to ament-share
    # lookup, then source-tree, then built-in defaults. Env var
    # COBOT_PICK_OFFSETS_PATH is also honored.
    pick_offsets_path: ""

    # ROS interfaces
    perception_service_name: "/perception/detect_once"
    pick_action_name: "/robot/pick_and_place"
    home_service_name: "/robot/home"

    # Cluster handling — closed-gripper push to disperse adjacent nuts.
    # 대상-이웃 거리가 cluster_dist_threshold_mm 미만이면 군집으로 판정해
    # 진입(±candidate_offset_mm) → push (-push_scale × Δ) → 홈 → 재관측.
    # docs/05_clustered_nuts_handling.md 참고.
    cluster_enabled: true
    cluster_dist_threshold_mm: 35.0
    cluster_candidate_offset_mm: 25.0
    cluster_push_scale: 1.5
    # push 시 z 높이 = grasp z + cluster_push_z_offset_mm.
    # grasp z = base_z + per_class_z_offset_mm (pick_offsets.yaml).
    # 양수면 grasp보다 위에서 밀어내, 닫힌 그리퍼 끝이 너트 표면을 살짝
    # 스치듯 통과시킨다.
    cluster_push_z_offset_mm: 2.0
    # 한 사이클(주문 처리)에서 같은 클래스에 대한 cluster push 시도 상한.
    # push 후에도 군집이 유지되면 무한 루프가 될 수 있어 cap 적용.
    max_cluster_pushes_per_class: 10

    # Retry policy
    max_detect_misses: 2
    max_grasp_failures: 2

    # Timeouts
    service_timeout_sec: 10.0
    action_timeout_sec: 60.0

    # Post-run verification. 사이클 마무리에서 홈→detect→remaining 계산→부족분 픽
    # 을 반복. 라운드별 보정 픽 성공 시 다음 라운드 detect에서 remaining=0 되어
    # 자동 break. 5는 안전 cap.
    verification_enabled: true
    max_verification_rounds: 5

    autostart: true
