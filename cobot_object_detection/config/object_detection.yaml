/**:
  ros__parameters:
    # Empty means: use the packaged models/best.pt, or the source-tree
    # training output when running directly from the workspace.
    model_path: ""
    class_names: ["almond", "cashew", "pistachio", "walnut"]
    imgsz: 800
    conf_threshold: 0.75
    iou_threshold: 0.50
    device: "cuda:0"                 # "" = auto, "cpu", "cuda:0"
    multi_frame_window_sec: 0.5
    # Per-class pixel thresholds are loaded from
    # cobot_config/config/dedup_thresholds.yaml (shared with perception).
    # Set dedup_thresholds_path to override; empty falls back to ament-share
    # then source-tree. Env var COBOT_DEDUP_THRESHOLDS_PATH is also honored.
    # cluster_distance_threshold_px is the legacy single-value fallback used
    # only when a class is missing from dedup_thresholds.yaml.
    dedup_thresholds_path: ""
    cluster_distance_threshold_px: 30.0
    color_topic: "/camera/camera/color/image_raw"
    output_topic: "/detection/objects"
    publish_when_empty: true
