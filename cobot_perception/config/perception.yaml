/**:
  ros__parameters:
    # Required for real transforms. Set this to the calibrated
    # T_gripper2camera.npy path for the robot/camera pair.
    gripper2camera_npy: "~/cobot_ws/src/cobot2/cobot_perception/resource/T_gripper2camera.npy"

    # camera-frame depth gates (mm)
    min_depth_camera_mm: 50.0
    max_depth_camera_mm: 1500.0

    # base-frame z corrections (matches lecture pick_and_place_voice)
    depth_offset_mm: -35.0
    min_depth_base_mm: 2.0

    # TCP source selector. "fixed" is the standalone-development default;
    # switch to "service" once cobot_robot_control is up to fetch the live TCP.
    tcp_source: "service"         # fixed | service
    fixed_tcp_xyz_mm: [400.0, 0.0, 400.0]
    fixed_tcp_zyz_deg: [0.0, 180.0, 0.0]
    tcp_service_name: "/robot/get_current_pose"
    # Doosan get_current_posx 응답이 ~2s 가까이 걸리는 케이스가 있어 5s로 둠.
    tcp_service_timeout_sec: 5.0

    # YOLO inference (perception이 직접 수행하는 trigger-based 방식)
    # Empty model_path → packaged models/best.pt를 ament-share에서 자동 탐색.
    model_path: ""
    class_names: ["almond", "cashew", "pistachio", "walnut"]
    imgsz: 800
    conf_threshold: 0.75
    iou_threshold: 0.50
    device: "cuda:0"                 # "" = auto, "cpu", "cuda:0"
    multi_frame_window_sec: 0.5
    cluster_distance_threshold_px: 30.0

    # Trigger 캡처 정책: detect_once 호출 시점 이후로 들어오는 color frame을
    # num_capture_frames장 모을 때까지 capture_timeout_sec 한도 내에서 대기.
    # 30Hz 카메라에서 5장이면 ~165ms (motion 잔재 차단 + multi-frame fusion 안정).
    num_capture_frames: 5
    capture_timeout_sec: 2.0

    # topics + service
    color_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    service_name: "/perception/detect_once"
